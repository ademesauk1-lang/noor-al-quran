name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip and Find Project
      run: |
        mkdir -p unzipped_project
        for zip in *.zip; do
          if [ -f "$zip" ]; then
            echo "Unzipping $zip..."
            unzip -q "$zip" -d unzipped_project
          fi
        done

    - name: Build with Gradle
      run: |
        GRADLEW_PATH=$(find unzipped_project -name "gradlew" | head -n 1)
        
        if [ -z "$GRADLEW_PATH" ]; then
          echo "gradlew not found! Generating with modern Gradle..."
          BUILD_GRADLE=$(find unzipped_project -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$BUILD_GRADLE" ]; then
            echo "Error: build.gradle not found either!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_GRADLE")
          cd "$PROJECT_DIR"
          
          # Download modern Gradle (8.4) that supports Java 17
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip
          unzip -q gradle-8.4-bin.zip
          ./gradle-8.4/bin/gradle wrapper
          
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          PROJECT_DIR=$(dirname "$GRADLEW_PATH")
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/app/build/outputs/apk/debug/*.apk
