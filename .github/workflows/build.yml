name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip and Build
      run: |
        ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" | head -n 1)
        echo "Unzipping $ZIP_FILE..."
        unzip "$ZIP_FILE" -d unzipped_project
        
        cd unzipped_project
        cd $(ls -d */ | head -n 1)
        
        chmod +x gradlew
        ./gradlew assembleDebug
        
        mkdir -p ../../apk_output
        find . -name "app-debug.apk" -exec cp {} ../../apk_output/ \;

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: apk_output/app-debug.apk
