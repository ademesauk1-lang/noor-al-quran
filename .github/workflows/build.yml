name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Unzip and Find Project
      run: |
        mkdir -p unzipped_project
        for zip in *.zip; do
          if [ -f "$zip" ]; then
            echo "Unzipping $zip..."
            unzip -q "$zip" -d unzipped_project
          fi
        done

    - name: Build with Gradle
      run: |
        # Find the root project directory by looking for settings.gradle first
        ROOT_DIR=$(find unzipped_project -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
        if [ -n "$ROOT_DIR" ]; then
          PROJECT_DIR=$(dirname "$ROOT_DIR")
        else
          # Fallback if no settings.gradle exists
          BUILD_GRADLE=$(find unzipped_project -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -z "$BUILD_GRADLE" ]; then
            echo "Error: Could not find any build.gradle or settings.gradle file!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_GRADLE")
        fi
        
        echo "Found project root directory at: $PROJECT_DIR"
        cd "$PROJECT_DIR"
        
        # Check if gradlew exists, if not generate with Gradle 9.3.1
        if [ ! -f "gradlew" ]; then
          echo "gradlew not found! Generating with modern Gradle 9.3.1..."
          wget -q https://services.gradle.org/distributions/gradle-9.3.1-bin.zip
          unzip -q gradle-9.3.1-bin.zip
          ./gradle-9.3.1/bin/gradle wrapper
        fi
        
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/app/build/outputs/apk/debug/*.apk
