name: Build APK from Zip

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Unzip and Find Project
      run: |
        mkdir -p unzipped_project
        for zip in *.zip; do
          if [ -f "$zip" ]; then
            echo "Unzipping $zip..."
            unzip -q "$zip" -d unzipped_project
          fi
        done

    - name: Build with Gradle
      run: |
        # Find gradlew automatically no matter where it is inside the zip
        GRADLEW_PATH=$(find unzipped_project -name "gradlew" | head -n 1)
        if [ -z "$GRADLEW_PATH" ]; then
          echo "Error: gradlew not found!"
          exit 1
        fi
        
        PROJECT_DIR=$(dirname "$GRADLEW_PATH")
        echo "Found project directory at: $PROJECT_DIR"
        
        cd "$PROJECT_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: |
          **/app/build/outputs/apk/debug/*.apk
